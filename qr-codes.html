<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes Challenge</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .qr-codes-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .qr-code {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Congratulations! Now scan these QR codes</h1>
    <p>Scan the QR codes below to unlock the next phase of the puzzle!</p>

    <div class="qr-codes-container">
        <div class="qr-code"><img src="Qr1.png" alt="QR Code 1"></div>
        <div class="qr-code"><img src="Qr2.png" alt="QR Code 2"></div>
        <div class="qr-code"><img src="Qr3.png" alt="QR Code 3"></div>
        <div class="qr-code"><img src="Qr4.png" alt="QR Code 4"></div>
        <div class="qr-code"><img src="Qr5.png" alt="QR Code 5"></div>
        <div class="qr-code"><img src="Qr6.png" alt="QR Code 6"></div>
    </div>

</body>
</html>
